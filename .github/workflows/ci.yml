name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon build --target js --release --deny-warn
      - run: node tools/test-host-input.mjs
      - run: moon run examples/time_window --target js
      - run: moon run examples/time_window --target wasm-gc
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/differential.py
      - run: python tools/test-time-window.py
      - run: python tools/example-smoke.py
      - name: Check pinned public recording on explicit workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/fetch-public-eeg.py work/S001R03.edf
          python tools/verify-public-eeg.py work/S001R03.edf --output evidence/public-eeg-ci.json
          node examples/run-public-epochs.mjs work/S001R03.edf work/eeg-epochs
